services:
  postgres:
    image: postgres:16-alpine
    container_name: pupsj-rms-postgres
    environment:
      POSTGRES_DB: pupsj_rms
      POSTGRES_USER: pupsj_rms
      POSTGRES_PASSWORD: pupsj_rms_local
    ports:
      - "5433:5432"
    volumes:
      - pupsj_rms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pupsj_rms -d pupsj_rms"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pupsj_rms_postgres:
